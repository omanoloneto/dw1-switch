[workspace]
resolver = "3"
members = ["crates/pack", "crates/psyq", "crates/decomp-c", "crates/dw1", "crates/backend", "crates/gpu-diff", "crates/decoder-diff", "crates/render", "crates/switch"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/loafykitten/dw1-silicon"
publish = false

# The game C calls into Rust through `extern "C"`; a panic must never unwind into it.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# The GPU differential tests rasterize a lot; keep them quick in plain `cargo test`.
[profile.dev.package.backend]
opt-level = 3

[profile.dev.package.gpu-diff]
opt-level = 3
